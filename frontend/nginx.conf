# Contopia — Frontend nginx (in-container, serves dist/)
# This is NOT the reverse proxy. The reverse proxy is in ./nginx/nginx.conf.
# This config runs INSIDE the frontend container (production stage) to serve
# the Vite-built SPA from /usr/share/nginx/html.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy no-referrer-when-downgrade;

        # ── SPA fallback — serve index.html for client-side routes ─────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Immutable cache for hashed assets (Vite emits /assets/ with content hashes) ──
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
