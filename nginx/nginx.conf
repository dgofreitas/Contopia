# Nginx - proxy reverso do Contopia
# Roteia / para o frontend e /api/ para o backend.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Capas e figuras podem ser maiores que o padrão de 1 MB
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    # Atrás do Caddy o IP real vem no X-Forwarded-For
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # Em dev não há Caddy na frente, então cai no esquema da própria conexão
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Nomes dos containers, e não dos serviços: em produção este nginx também
    # está na rede do moneyTrackr, onde "frontend" e "backend" são os de lá.
    upstream frontend_service {
        server contopia_frontend:80;
        keepalive 16;
    }

    upstream backend_service {
        server contopia_backend:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Login e cadastro: limite mais rígido contra tentativa e erro
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_service;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_service;
        }

        location / {
            proxy_pass http://frontend_service;
        }
    }
}
