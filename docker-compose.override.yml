# Contopia — Dev Override (Two-Target Pattern)
# Docker Compose auto-loads this alongside docker-compose.yml
# Uses pre-built :dev images. If missing, `docker compose up --build` builds
# them via build.target override (development stage).
#
# Build dev images explicitly:
#   docker build --target development -t contopia/frontend:dev -f frontend/Dockerfile .
#   docker build --target development -t contopia/backend:dev  -f backend/Dockerfile .

services:
  frontend:
    image: contopia/frontend:dev # ← swap to dev image (node + vite)
    build:
      target: development # ← build dev target if image missing
    volumes:
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      - ./frontend/index.html:/app/index.html:delegated
      # NÃO montar vite.config.js — Vite grava .timestamp ao lado e quebra com user non-root
      - ./shared:/app/shared:delegated
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-/api} # Vite dev server lê process.env em runtime
    command: ['npm', 'run', 'dev', '--', '--host', '--port', '80']
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  backend:
    image: contopia/backend:dev # ← swap to dev image (node + devDeps)
    build:
      target: development
    volumes:
      - ./backend/src:/app/src:delegated
      - ./shared:/shared:delegated
    environment:
      - NODE_ENV=development
    command: ['npm', 'run', 'dev', '--', '--legacy-watch']

  mongodb:
    ports:
      - '27017:27017' # Expose for local tools (MongoDB Compass, mongosh)
